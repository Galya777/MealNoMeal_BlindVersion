name: Build and Sign Android Release (API 36)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build patched fyne CLI for API 36
        run: ./tools/build_fyne_api36.sh

      - name: Build Android App Bundle (AAB) with API 36
        run: |
          # The -name flag sets the app name, not the file name.
          # The output file name is derived from FyneApp.toml.
          ./bin/fyne-api36 package -os android --app-id com.nothicalnonsence.mealnomeal --release
        env:
          CGO_ENABLED: 1

      - name: Sign the AAB
        run: |
          # Find the generated .aab file and sign it.
          AAB_FILE=$(ls *.aab | head -n 1)
          echo "Found AAB file: $AAB_FILE"
          jarsigner -keystore upload.jks -storepass mealnomeal123 "$AAB_FILE" upload
        
      - name: Verify the signature
        run: |
          AAB_FILE=$(ls *.aab | head -n 1)
          echo "Verifying signature for: $AAB_FILE"
          jarsigner -verify "$AAB_FILE"

      - name: Upload Signed AAB for release
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          # Upload the (now signed) AAB file.
          path: ./*.aab