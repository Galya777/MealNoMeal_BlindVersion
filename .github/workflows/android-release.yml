name: Build and Sign Android Release (API 36)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build patched fyne CLI for API 36
        run: ./tools/build_fyne_api36.sh

      - name: Build Android App Bundle (AAB) with API 36 (Diagnostic)
        run: |
          echo "Attempting to build AAB with fyne-api36..."
          # Redirect all output to a log file for debugging
          ./bin/fyne-api36 package -os android --app-id com.nothicalnonsence.mealnomeal --release > fyne_build.log 2>&1
          
          echo "--- Content of fyne_build.log ---"
          cat fyne_build.log
          echo "--- End of fyne_build.log ---"
          
          # Check if an AAB file was actually created
          AAB_FILE=$(ls *.aab 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: No .aab file was generated by fyne-api36 package command."
            exit 1
          fi
          echo "Successfully generated AAB file: $AAB_FILE"
        env:
          CGO_ENABLED: 1

      - name: Sign the AAB
        run: |
          AAB_FILE=$(ls *.aab | head -n 1)
          echo "Found AAB file for signing: $AAB_FILE"
          jarsigner -keystore upload.jks -storepass mealnomeal123 "$AAB_FILE" upload
        
      - name: Verify the signature
        run: |
          AAB_FILE=$(ls *.aab | head -n 1)
          echo "Verifying signature for: $AAB_FILE"
          jarsigner -verify "$AAB_FILE"

      - name: Upload Signed AAB for release
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-release
          path: ./*.aab